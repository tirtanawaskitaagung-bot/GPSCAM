<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Map Camera - Landscape</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Custom scrollbar for text if overflows on small screens */
        .custom-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        /* Leaflet tweaks */
        .leaflet-control-attribution, .leaflet-control-zoom {
            display: none !important;
        }

        /* Glassmorphism background for overlay */
        .stamp-bg {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center relative select-none">

    <!-- Landscape Warning (Visible only on Portrait Mobile Screens) -->
    <div id="orientation-warning" class="hidden fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center text-center p-6 sm:hidden">
        <i class="fa-solid fa-rotate text-yellow-400 text-5xl mb-4 animate-spin" style="animation-duration: 4s;"></i>
        <h2 class="text-xl font-bold mb-2 text-white">Mode Landscape Direkomendasikan</h2>
        <p class="text-gray-300 text-sm mb-4">Untuk hasil terbaik seperti contoh, putar posisi HP Anda ke landscape (horisontal).</p>
        <button onclick="dismissWarning()" class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-semibold text-sm shadow">
            Tetap Lanjutkan
        </button>
    </div>

    <!-- Main Viewport Area -->
    <div id="app-container" class="relative w-full h-full flex items-center justify-center bg-black overflow-hidden">
        
        <!-- Camera Video Feed -->
        <video id="video-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        
        <!-- Hidden Canvas for Capture Processing -->
        <canvas id="capture-canvas" class="hidden"></canvas>

        <!-- Live Camera Controls Header -->
        <div class="absolute top-3 left-4 right-4 flex justify-between items-center z-20 pointer-events-none">
            <!-- App Badge -->
            <div class="flex items-center gap-2 bg-black/60 px-3 py-1.5 rounded-full backdrop-blur-md border border-white/10">
                <i class="fa-solid fa-location-dot text-red-500 text-sm"></i>
                <span class="text-xs font-semibold tracking-wide text-white">GPS Map Camera</span>
            </div>

            <!-- Status Indicator & Tools -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <div id="gps-status" class="flex items-center gap-1.5 bg-black/60 px-2.5 py-1 rounded-full text-[10px] font-medium text-yellow-400 border border-white/10">
                    <i class="fa-solid fa-spinner animate-spin"></i>
                    <span id="gps-status-text">Mencari Sinyal GPS...</span>
                </div>
                <button id="switch-cam-btn" onclick="switchCamera()" class="w-8 h-8 rounded-full bg-black/60 border border-white/20 text-white flex items-center justify-center active:scale-95 transition">
                    <i class="fa-solid fa-camera-rotate text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Shutter Button (Right Side for Landscape Ergonomics) -->
        <div class="absolute right-4 top-1/2 -translate-y-1/2 z-30 flex flex-col items-center gap-4">
            <button id="shutter-btn" onclick="takePhoto()" class="w-16 h-16 rounded-full border-4 border-white bg-red-600 active:bg-red-700 shadow-lg flex items-center justify-center transform active:scale-90 transition-all">
                <div class="w-12 h-12 rounded-full border-2 border-black/30"></div>
            </button>
        </div>

        <!-- Stamp Overlay Preview (Lower Section) -->
        <div id="stamp-overlay" class="absolute bottom-3 left-3 right-20 z-20 rounded-xl stamp-bg border border-white/10 p-2.5 sm:p-3 flex items-center gap-3 max-h-[48%] overflow-hidden">
            <!-- Mini Map Container -->
            <div class="relative w-28 h-28 sm:w-36 sm:h-36 rounded-lg overflow-hidden flex-shrink-0 border border-white/20 shadow">
                <div id="leaflet-map" class="w-full h-full bg-gray-800"></div>
                <!-- Custom Pin Marker Simulation on top of Leaflet Map -->
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-[400]">
                    <i class="fa-solid fa-location-dot text-red-600 text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] -mt-4"></i>
                </div>
            </div>

            <!-- Information Text Area -->
            <div class="flex-1 flex flex-col justify-center text-left text-white leading-normal overflow-y-auto max-h-full custom-scroll pr-1">
                <!-- Location Name / Address Details -->
                <h3 id="stamp-address-main" class="font-bold text-xs sm:text-sm text-gray-100 line-clamp-2 leading-tight">
                    Mendapatkan Alamat...
                </h3>
                <p id="stamp-address-sub" class="text-[10px] sm:text-xs text-gray-300 mt-1 line-clamp-2 leading-tight">
                    Menghubungkan ke lokasi satelit GPS...
                </p>

                <!-- Coordinates & Timestamp Info -->
                <div class="mt-2 pt-1.5 border-t border-white/20 flex flex-col gap-1 text-[10px] sm:text-xs font-mono text-gray-100">
                    <div class="flex flex-wrap items-center gap-x-3 font-semibold">
                        <span>Lat <strong id="stamp-lat" class="text-white">-</strong></span>
                        <span>Long <strong id="stamp-long" class="text-white">-</strong></span>
                    </div>
                    <div class="flex flex-wrap items-center gap-x-3 text-gray-300">
                        <span id="stamp-datetime" class="font-semibold text-white">--/--/-- --:--:--</span>
                        <span id="stamp-timezone" class="text-yellow-400 font-bold">GMT +07:00</span>
                    </div>
                </div>
            </div>

            <!-- App Branding Icon Tag (Bottom-Right inside Overlay) -->
            <div class="hidden sm:flex flex-col items-center justify-center h-full pl-2 border-l border-white/10 text-center">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-xs font-bold shadow">
                    <i class="fa-solid fa-camera text-sm"></i>
                </div>
                <span class="text-[9px] font-bold text-gray-300 mt-1 uppercase tracking-wider">GPS MAP</span>
            </div>
        </div>

    </div>

    <!-- Preview Modal (Shown after photo capture) -->
    <div id="preview-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-3">
        <div class="relative max-w-4xl w-full h-[80vh] flex items-center justify-center">
            <img id="preview-img" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-white/20" alt="Captured GPS Photo">
        </div>

        <!-- Action Controls -->
        <div class="mt-4 flex items-center gap-4">
            <button onclick="closePreview()" class="px-5 py-2.5 rounded-full bg-gray-700 hover:bg-gray-600 text-white font-semibold text-sm flex items-center gap-2 active:scale-95 transition">
                <i class="fa-solid fa-arrows-rotate"></i> Foto Ulang
            </button>
            <button onclick="downloadPhoto()" class="px-6 py-2.5 rounded-full bg-green-600 hover:bg-green-500 text-white font-semibold text-sm flex items-center gap-2 shadow-lg active:scale-95 transition">
                <i class="fa-solid fa-download"></i> Simpan Gambar
            </button>
        </div>
    </div>

    <script>
        // State Variables
        let videoStream = null;
        let currentFacingMode = 'environment'; // 'user' or 'environment'
        let leafletMap = null;
        let mapTileLayer = null;
        let capturedDataUrl = null;

        let currentCoords = {
            lat: 0,
            lng: 0,
            acc: 0
        };

        let locationDetails = {
            mainAddress: "Lokasi Tidak Diketahui",
            subAddress: "Memuat info lokasi...",
            road: "",
            village: "",
            district: "",
            city: "",
            state: "",
            postcode: "",
            country: "",
            latStr: "-",
            lngStr: "-",
            dateTimeStr: "-",
            tzStr: "GMT +07:00"
        };
        // Reverse Geocode to get detailed address components
        async function reverseGeocode(lat, lng) {
            const now = Date.now();
            if (now - lastGeocodeTime < 6000) return; // limit requests
            lastGeocodeTime = now;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                    headers: { 'Accept-Language': 'id-ID,id;q=0.9,en;q=0.8' }
                });
                if (!response.ok) return;

                const data = await response.json();
                if (data && data.address) {
                    const addr = data.address;

                    // Detail Komponen Alamat Lengkap
                    const road = addr.road || addr.pedestrian || addr.street || addr.suburb || "";
                    const village = addr.village || addr.kelurahan || addr.neighbourhood || addr.hamlet || "";
                    const district = addr.subdistrict || addr.district || addr.kecamatan || "";
                    const city = addr.city || addr.regency || addr.county || addr.kabupaten || addr.kota || "";
                    const state = addr.state || addr.province || "";
                    const country = addr.country || "Indonesia";
                    const postcode = addr.postcode || "";

                    // Baris 1: Kecamatan, Kabupaten/Kota, Provinsi, Negara
                    let mainParts = [district, city, state, country].filter(Boolean);
                    locationDetails.mainAddress = mainParts.join(", ") || "Lokasi Ditemukan";

                    // Baris 2: Nama Jalan, Kelurahan/Desa, Kode Pos
                    let subParts = [];
                    if (road) subParts.push("Jl. " + road.replace(/^Jl\.\s*/i, ''));
                    if (village) subParts.push(village);
                    if (postcode) subParts.push(postcode);
                    if (subParts.length === 0 && (city || state)) subParts.push(city || state);
                    locationDetails.subAddress = subParts.join(", ");

                    // Update DOM Preview Screen
                    stampAddressMain.innerText = locationDetails.mainAddress;
                    stampAddressSub.innerText = locationDetails.subAddress;
                }
            } catch (err) {
                console.error("Geocoding error:", err);
            }
        }
        // Helper function to draw map and text onto Canvas (Fixed Vertical Spacing & Proportions)
        async function drawStampOverlayOnCanvas(ctx, width, height) {
            // Scale factor proportional to image resolution
            const scale = Math.max(1, height / 720);
            const margin = 24 * scale;
            
            // Stamp Container dimensions
            const stampHeight = Math.min(height * 0.32, 260 * scale);
            const stampWidth = width - (margin * 2) - (90 * scale); // space for shutter on right
            const stampX = margin;
            const stampY = height - stampHeight - margin;
            const cornerRadius = 16 * scale;

            // Draw Dark Glass background
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(stampX, stampY, stampWidth, stampHeight, cornerRadius);
            ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
            ctx.fill();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 2 * scale;
            ctx.stroke();
            ctx.restore();

            // Draw Mini Map Snapshot
            const mapSize = stampHeight - (24 * scale);
            const mapX = stampX + (12 * scale);
            const mapY = stampY + (12 * scale);

            try {
                const mapCanvas = await createStaticMapCanvas(mapSize, mapSize);
                if (mapCanvas) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(mapX, mapY, mapSize, mapSize, 10 * scale);
                    ctx.clip();
                    ctx.drawImage(mapCanvas, mapX, mapY, mapSize, mapSize);
                    ctx.restore();

                    // Map border
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                    ctx.lineWidth = 1.5 * scale;
                    ctx.strokeRect(mapX, mapY, mapSize, mapSize);

                    // Red Marker Pin on Center of Map
                    drawLocationPin(ctx, mapX + mapSize / 2, mapY + mapSize / 2 - (4 * scale), scale);
                }
            } catch (e) {
                console.warn("Map capture skipped:", e);
            }

            // Draw Text Information with Strict Non-Overlapping Line Calculations
            const textX = mapX + mapSize + (16 * scale);
            const maxTextWidth = stampX + stampWidth - textX - (20 * scale);
            let currentY = mapY + (20 * scale);

            ctx.textAlign = "left";
            ctx.textBaseline = "top";

            // Baris 1: Main Address (Judul Wilayah - Kecamatan, Kab, Prov)
            ctx.fillStyle = "#FFFFFF";
            ctx.font = `bold ${Math.round(15 * scale)}px Inter, sans-serif`;
            const mainLineHeight = 20 * scale;
            currentY = drawWrappedText(ctx, locationDetails.mainAddress || "Lokasi GPS", textX, currentY, maxTextWidth, mainLineHeight, 2);

            // Baris 2: Sub Address (Detail Jalan & Desa)
            currentY += 4 * scale;
            ctx.fillStyle = "#E2E8F0";
            ctx.font = `500 ${Math.round(12 * scale)}px Inter, sans-serif`;
            const subLineHeight = 16 * scale;
            currentY = drawWrappedText(ctx, locationDetails.subAddress || "", textX, currentY, maxTextWidth, subLineHeight, 2);

            // Garis Pemisah (Divider Line)
            currentY += 8 * scale;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1 * scale;
            ctx.beginPath();
            ctx.moveTo(textX, currentY);
            ctx.lineTo(stampX + stampWidth - (20 * scale), currentY);
            ctx.stroke();

            // Baris 3: Latitude & Longitude
            currentY += 10 * scale;
            ctx.fillStyle = "#FFFFFF";
            ctx.font = `bold ${Math.round(13 * scale)}px monospace`;
            ctx.fillText(`Lat ${locationDetails.latStr}   Long ${locationDetails.lngStr}`, textX, currentY);

            // Baris 4: Waktu & Timezone (Kuning)
            currentY += 18 * scale;
            ctx.fillStyle = "#F1F5F9";
            ctx.font = `bold ${Math.round(13 * scale)}px monospace`;
            ctx.fillText(locationDetails.dateTimeStr + "  ", textX, currentY);

            const dtWidth = ctx.measureText(locationDetails.dateTimeStr + "  ").width;
            ctx.fillStyle = "#FACC15"; // Yellow Accent
            ctx.fillText(locationDetails.tzStr, textX + dtWidth, currentY);
        }

        // Precise Canvas Word Wrapper with Baseline Adjustment
        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
            if (!text) return y;
            const words = text.split(' ');
            let line = '';
            let lineCount = 0;
            let startY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line.trim(), x, startY);
                    line = words[n] + ' ';
                    startY += lineHeight;
                    lineCount++;
                    if (lineCount >= maxLines - 1) {
                        let truncated = words.slice(n).join(' ');
                        while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 0) {
                            truncated = truncated.slice(0, -1);
                        }
                        ctx.fillText(truncated.trim() + '...', x, startY);
                        return startY + lineHeight;
                    }
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line.trim(), x, startY);
            return startY + lineHeight;
        }

        // 1. Camera Handling
        async function initCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false
            };

            try {
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = videoStream;
            } catch (err) {
                console.error("Camera access error:", err);
                // Fallback attempt with simple constraints
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    videoElement.srcObject = videoStream;
                } catch (fallbackErr) {
                    alert("Gagal mengakses kamera. Pastikan izin kamera telah diberikan.");
                }
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            initCamera();
        }

        // 2. Map Initialization (Leaflet)
        function initLeafletMap() {
            // Default Center: Jakarta
            const defaultLat = -6.2088;
            const defaultLng = 106.8456;

            leafletMap = L.map('leaflet-map', {
                zoomControl: false,
                attributionControl: false,
                dragging: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                touchZoom: false
            }).setView([defaultLat, defaultLng], 15);

            // Esri World Imagery (Satellite) Map Tile Layer
            mapTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                crossOrigin: true
            }).addTo(leafletMap);
        }

        function updateMapPosition(lat, lng) {
            if (leafletMap) {
                leafletMap.setView([lat, lng], 16);
                // Force leaflet map redraw after size adjustments
                setTimeout(() => leafletMap.invalidateSize(), 200);
            }
        }

        // 3. GPS Geolocation & Real-time Info
        function initGPSWatcher() {
            if (!navigator.geolocation) {
                gpsStatusText.innerText = "GPS Tidak Didukung";
                return;
            }

            const options = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            };

            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    currentCoords.lat = lat;
                    currentCoords.lng = lng;
                    currentCoords.acc = position.coords.accuracy;

                    // Formatted strings
                    locationDetails.latStr = lat.toFixed(6) + "°";
                    locationDetails.lngStr = lng.toFixed(6) + "°";

                    stampLat.innerText = locationDetails.latStr;
                    stampLong.innerText = locationDetails.lngStr;

                    // Update GPS Indicator UI
                    gpsStatusIcon.className = "flex items-center gap-1.5 bg-green-950/80 text-green-400 px-2.5 py-1 rounded-full text-[10px] font-medium border border-green-500/30";
                    gpsStatusText.innerText = `GPS Aktif (±${Math.round(currentCoords.acc)}m)`;

                    // Update Map View
                    updateMapPosition(lat, lng);

                    // Reverse Geocode to get address details
                    reverseGeocode(lat, lng);
                },
                (error) => {
                    console.warn("Geolocation warning:", error.message);
                    gpsStatusIcon.className = "flex items-center gap-1.5 bg-red-950/80 text-red-400 px-2.5 py-1 rounded-full text-[10px] font-medium border border-red-500/30";
                    gpsStatusText.innerText = "Sinyal GPS Lemah";
                },
                options
            );
        }

        // Debounce reverse geocoding to respect API limits
        let lastGeocodeTime = 0;
        async function reverseGeocode(lat, lng) {
            const now = Date.now();
            if (now - lastGeocodeTime < 8000) return; // limit requests to every 8s max
            lastGeocodeTime = now;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                    headers: { 'Accept-Language': 'id-ID,id;q=0.9,en;q=0.8' }
                });
                if (!response.ok) return;

                const data = await response.json();
                if (data && data.address) {
                    const addr = data.address;
                    
                    // Construct detailed components
                    const district = addr.subdistrict || addr.district || addr.village || addr.town || "";
                    const regency = addr.city || addr.county || addr.regency || "";
                    const state = addr.state || "";
                    const country = addr.country || "Indonesia";
                    const postcode = addr.postcode || "";
                    const road = addr.road || addr.suburb || "";

                    // Main Header Line (Kecamatan, Provinsi, Negara)
                    let mainTitleParts = [district, state, country].filter(Boolean);
                    locationDetails.mainAddress = mainTitleParts.join(", ") || "Lokasi Ditemukan";

                    // Sub Detail Line (Full street address & Postcode)
                    let subTitleParts = [road, district, regency, state, postcode, country].filter(Boolean);
                    locationDetails.subAddress = subTitleParts.join(", ");

                    // Update DOM
                    stampAddressMain.innerText = locationDetails.mainAddress;
                    stampAddressSub.innerText = locationDetails.subAddress;
                }
            } catch (err) {
                console.error("Geocoding failed:", err);
            }
        }

        // Live Clock & Timezone Updater
        function startClock() {
            function update() {
                const now = new Date();
                
                // Format Date & Time: DD/MM/YY HH:MM:SS AM/PM
                const day = String(now.getDate()).padStart(2, '0');
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = String(now.getFullYear()).slice(-2);
                
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12; // hour '0' should be '12'
                const formattedHours = String(hours).padStart(2, '0');

                locationDetails.dateTimeStr = `${day}/${month}/${year} ${formattedHours}:${minutes}:${seconds} ${ampm}`;
                stampDateTime.innerText = locationDetails.dateTimeStr;

                // Timezone Offset Calculation
                const offsetMinutes = -now.getTimezoneOffset();
                const offsetHours = Math.floor(Math.abs(offsetMinutes) / 60);
                const sign = offsetMinutes >= 0 ? '+' : '-';
                const formattedOffset = `GMT ${sign}${String(offsetHours).padStart(2, '0')}:00`;
                
                locationDetails.tzStr = formattedOffset;
                stampTimezone.innerText = locationDetails.tzStr;
            }

            update();
            setInterval(update, 1000);
        }

        // 4. Capture & Stamp Drawing on Canvas
        async function takePhoto() {
            const videoWidth = videoElement.videoWidth;
            const videoHeight = videoElement.videoHeight;

            if (!videoWidth || !videoHeight) {
                alert("Kamera belum siap, coba lagi.");
                return;
            }

            // Canvas Dimensions set to matching Camera Video Native Resolution
            canvasElement.width = videoWidth;
            canvasElement.height = videoHeight;
            const ctx = canvasElement.getContext('2d');

            // Draw Video Frame (Mirror if front camera)
            ctx.save();
            if (currentFacingMode === 'user') {
                ctx.translate(videoWidth, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(videoElement, 0, 0, videoWidth, videoHeight);
            ctx.restore();

            // Render Stamp Overlay on Canvas
            await drawStampOverlayOnCanvas(ctx, videoWidth, videoHeight);

            // Export to Image Data URL
            capturedDataUrl = canvasElement.toDataURL('image/jpeg', 0.92);

            // Display in Preview Modal
            document.getElementById('preview-img').src = capturedDataUrl;
            document.getElementById('preview-modal').classList.remove('hidden');
        }

        // Helper function to draw map and text onto Canvas
        async function drawStampOverlayOnCanvas(ctx, width, height) {
            // Relative Scaling factors based on 1080p canvas height
            const scale = height / 720;
            const margin = 20 * scale;
            
            // Stamp Container dimensions
            const stampHeight = Math.min(height * 0.28, 220 * scale);
            const stampWidth = width - (margin * 2) - (80 * scale); // leave right space for shutter
            const stampX = margin;
            const stampY = height - stampHeight - margin;
            const cornerRadius = 14 * scale;

            // Draw Dark Semi-transparent Glass Background
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(stampX, stampY, stampWidth, stampHeight, cornerRadius);
            ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
            ctx.fill();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.lineWidth = 1.5 * scale;
            ctx.stroke();
            ctx.restore();

            // Draw Map Image (Render Leaflet Map area to canvas via Image Blob or Canvas Capture)
            const mapSize = stampHeight - (16 * scale);
            const mapX = stampX + (8 * scale);
            const mapY = stampY + (8 * scale);

            try {
                // Grab tile canvas from Leaflet container
                const mapCanvas = await createStaticMapCanvas(mapSize, mapSize);
                if (mapCanvas) {
                    ctx.save();
                    // Clip rounded rectangle for mini-map
                    ctx.beginPath();
                    ctx.roundRect(mapX, mapY, mapSize, mapSize, 8 * scale);
                    ctx.clip();
                    ctx.drawImage(mapCanvas, mapX, mapY, mapSize, mapSize);
                    ctx.restore();

                    // Map border
                    ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    ctx.lineWidth = 1 * scale;
                    ctx.strokeRect(mapX, mapY, mapSize, mapSize);

                    // Draw Red Location Pin Center of Mini Map
                    drawLocationPin(ctx, mapX + mapSize / 2, mapY + mapSize / 2 - (4 * scale), scale);
                }
            } catch (e) {
                console.warn("Map canvas capture skipped", e);
            }

            // Draw Text Information
            const textX = mapX + mapSize + (14 * scale);
            let textY = mapY + (18 * scale);
            const maxTextWidth = stampX + stampWidth - textX - (15 * scale);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = `bold ${Math.round(14 * scale)}px sans-serif`;

            // Main Address
            const mainAddressText = locationDetails.mainAddress || "Lokasi GPS";
            textY = wrapText(ctx, mainAddressText, textX, textY, maxTextWidth, 18 * scale, 2);

            // Sub Address / Detailed Street
            ctx.fillStyle = "#E2E8F0";
            ctx.font = `${Math.round(11 * scale)}px sans-serif`;
            textY += 4 * scale;
            const subAddressText = locationDetails.subAddress || "";
            textY = wrapText(ctx, subAddressText, textX, textY, maxTextWidth, 14 * scale, 2);

            // Separator Line
            textY += 6 * scale;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1 * scale;
            ctx.beginPath();
            ctx.moveTo(textX, textY);
            ctx.lineTo(stampX + stampWidth - (15 * scale), textY);
            ctx.stroke();

            // Coordinates Line
            textY += 14 * scale;
            ctx.fillStyle = "#F8FAFC";
            ctx.font = `500 ${Math.round(11 * scale)}px monospace`;
            ctx.fillText(`Lat ${locationDetails.latStr}   Long ${locationDetails.lngStr}`, textX, textY);

            // Date & Time + Timezone Line
            textY += 14 * scale;
            ctx.fillStyle = "#CBD5E1";
            ctx.fillText(`${locationDetails.dateTimeStr}  `, textX, textY);
            
            // Timezone highlighted in yellow/orange
            const dateWidth = ctx.measureText(`${locationDetails.dateTimeStr}  `).width;
            ctx.fillStyle = "#FACC15";
            ctx.font = `bold ${Math.round(11 * scale)}px monospace`;
            ctx.fillText(locationDetails.tzStr, textX + dateWidth, textY);
        }

        // Generate Leaflet Map snapshot to standard Canvas
        function createStaticMapCanvas(w, h) {
            return new Promise((resolve) => {
                const mapContainer = document.getElementById('leaflet-map');
                const tileImages = mapContainer.querySelectorAll('.leaflet-tile-loaded');

                const offCanvas = document.createElement('canvas');
                offCanvas.width = w;
                offCanvas.height = h;
                const offCtx = offCanvas.getContext('2d');

                // Fill background
                offCtx.fillStyle = '#1e293b';
                offCtx.fillRect(0, 0, w, h);

                if (tileImages.length === 0) {
                    resolve(offCanvas);
                    return;
                }

                let loadedCount = 0;
                const containerRect = mapContainer.getBoundingClientRect();

                tileImages.forEach((img) => {
                    const rect = img.getBoundingClientRect();
                    const dx = rect.left - containerRect.left;
                    const dy = rect.top - containerRect.top;

                    const tileImg = new Image();
                    tileImg.crossOrigin = 'anonymous';
                    tileImg.onload = () => {
                        try {
                            offCtx.drawImage(tileImg, dx, dy, rect.width, rect.height);
                        } catch (e) {}
                        loadedCount++;
                        if (loadedCount >= tileImages.length) {
                            resolve(offCanvas);
                        }
                    };
                    tileImg.onerror = () => {
                        loadedCount++;
                        if (loadedCount >= tileImages.length) {
                            resolve(offCanvas);
                        }
                    };
                    tileImg.src = img.src;
                });

                // Fallback timeout in case images take too long
                setTimeout(() => resolve(offCanvas), 600);
            });
        }

        // Draw Map Marker Pin on Canvas
        function drawLocationPin(ctx, x, y, scale) {
            const r = 10 * scale;
            ctx.save();
            
            // Pin Body Shadow
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 4 * scale;
            ctx.shadowOffsetY = 2 * scale;

            // Pin Shape
            ctx.beginPath();
            ctx.arc(x, y - r, r, 0.4, Math.PI - 0.4);
            ctx.lineTo(x, y + (4 * scale));
            ctx.closePath();
            ctx.fillStyle = "#DC2626"; // Red pin
            ctx.fill();
            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 1.5 * scale;
            ctx.stroke();

            // Inner White Dot
            ctx.beginPath();
            ctx.arc(x, y - r, r * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = "#FFFFFF";
            ctx.fill();

            ctx.restore();
        }

        // Helper: Canvas Text Wrapper
        function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
            const words = text.split(' ');
            let line = '';
            let lineCount = 0;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                    lineCount++;
                    if (lineCount >= maxLines - 1) {
                        // Truncate remainder with ellipsis
                        let truncated = words.slice(n).join(' ');
                        while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 0) {
                            truncated = truncated.slice(0, -1);
                        }
                        ctx.fillText(truncated + '...', x, y);
                        return y;
                    }
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
            return y;
        }

        // 5. Modal & Download Handling
        function closePreview() {
            document.getElementById('preview-modal').classList.add('hidden');
        }

        function downloadPhoto() {
            if (!capturedDataUrl) return;
            
            const timestamp = new Date().toISOString().replace(/[-:T.]/g, "").slice(0, 14);
            const filename = `GPS_MAP_${timestamp}.jpg`;
            
            const a = document.createElement('a');
            a.href = capturedDataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
